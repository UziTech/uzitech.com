<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <!-- 1. The meta refresh tag does the actual redirection instantly (0 seconds) -->
  <meta http-equiv="refresh" content="0; URL=https://tony.brix.ninja">
  <!-- 2. The canonical link tells search engines where the definitive version lives for SEO -->
  <link rel="canonical" href="https://tony.brix.ninja">

  <style>
    body {
      opacity: 0;
      animation: delay 2s forwards;
    }

    @keyframes delay {
      from {
        opacity: 0;
      }

      99% {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <p>If you are not redirected automatically, go to <a href="https://tony.brix.ninja">tony.brix.ninja</a>.</p>
</body>

</html>
